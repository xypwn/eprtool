[project]
name = "eprtool"
version = "0.1.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imgui-bundle>=1.93.0",
    "typst>=0.15.0",
    "crossfiledialog",
    "chardet",
    "platformdirs",
    "tomli-w>=1.2.0",
    "show-in-file-manager>=1.1.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project.gui-scripts]
eprtool = "eprtool:main"

# eprtool-dev is inside "scripts" to not suppress CLI output on Windows.
[project.scripts]
eprtool-dev = "eprtool:main"
