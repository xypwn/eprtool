[project]
name = "eprtool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "slimgui",
    "glfw",
    "pyopengl",
    "numpy",
    "typst",
    "crossfiledialog",
    "chardet",
    "platformdirs",
    "tomli-w>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project.gui-scripts]
eprtool = "eprtool:main"