[project]
name = "eprtool"
version = "0.1.7"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chardet",
    "crossfiledialog",
    "glfw",
    "imgui-bundle>=1.93.0",
    "platformdirs",
    "pycodestyle>=2.15.0",
    "pylint>=4.1.3",
    "show-in-file-manager>=1.1.6",
    "simplemma>=2.0.0",
    "tomli-w>=1.2.0",
    "typst>=0.15.0",
    "watchdog>=7.1.0",
]

[tool.ruff]
target-version = "py314"

[dependency-groups]
test = ["pytest"]
package = ["pyinstaller"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project.gui-scripts]
eprtool = "eprtool:main"
eprcheck = "eprcheck:main"

# *-dev is inside "scripts" to not suppress CLI output on Windows.
[project.scripts]
eprtool-dev = "eprtool:main"
eprcheck-dev = "eprcheck:main"
readme-gen = "misc.readme_gen:main"
