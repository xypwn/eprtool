on:
  release:
    types: [created]

permissions:
    contents: write
    packages: write

jobs:
  release-windows:
    name: Release Windows Binary
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Build executables
      run: |
        uv venv --python 3.15
        uv sync
        uv pip install --group test --group package
        uv run pyinstaller eprtool.spec -- --guionly
        uv run pyinstaller eprcheck.spec -- --guionly
    - name: Rename executable
      run: mv dist/*.exe .
    - name: Upload executable
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          eprtool.exe
          eprcheck.exe

  release-linux:
    name: Release Linux Binary
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Build executables
      run: |
        uv venv --python 3.15
        uv sync
        uv pip install --group test --group package
        uv run pyinstaller eprtool.spec -- --guionly
        uv run pyinstaller eprcheck.spec -- --guionly
    - name: Rename executable
      run: mv dist/* .
    - name: Create archive
      run: |
        tar cJf eprtool-linux.tar.xz eprtool eprcheck
    - name: Upload archive
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: eprtool-linux.tar.xz